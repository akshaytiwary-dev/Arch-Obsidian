<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="grooves" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="30%" stop-color="#181818" />
      <stop offset="35%" stop-color="#111111" />
      <stop offset="50%" stop-color="#222222" />
      <stop offset="65%" stop-color="#151515" />
      <stop offset="80%" stop-color="#242424" />
      <stop offset="95%" stop-color="#111111" />
      <stop offset="100%" stop-color="#080808" />
    </radialGradient>
    <linearGradient id="sheen1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="40%" stop-color="rgba(255,255,255,0.0)" />
      <stop offset="60%" stop-color="rgba(255,255,255,0.0)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.15)" />
    </linearGradient>
    <linearGradient id="sheen2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)" />
      <stop offset="40%" stop-color="rgba(255,255,255,0.0)" />
      <stop offset="60%" stop-color="rgba(255,255,255,0.0)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.12)" />
    </linearGradient>
  </defs>
  
  <!-- Outer Vinyl Body -->
  <circle cx="100" cy="100" r="98" fill="url(#grooves)" stroke="#2a2a2a" stroke-width="1.5" />
  
  <!-- Subtle Vinyl Grooves -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  <circle cx="100" cy="100" r="82" fill="none" stroke="rgba(0,0,0,0.6)" stroke-width="1" />
  <circle cx="100" cy="100" r="74" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  <circle cx="100" cy="100" r="66" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="1" />
  <circle cx="100" cy="100" r="58" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  <circle cx="100" cy="100" r="50" fill="none" stroke="rgba(0,0,0,0.6)" stroke-width="1" />
  <circle cx="100" cy="100" r="42" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  
  <!-- Sheen / Light Reflection Cones -->
  <circle cx="100" cy="100" r="98" fill="url(#sheen1)" />
  <circle cx="100" cy="100" r="98" fill="url(#sheen2)" />
  
  <!-- Center Label -->
  <circle cx="100" cy="100" r="34" fill="#bf616a" stroke="#4c566a" stroke-width="1" />
  <circle cx="100" cy="100" r="31" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.5" />
  <circle cx="100" cy="100" r="16" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="0.5" />
  
  <!-- Spindle Hole -->
  <circle cx="100" cy="100" r="7" fill="#1e1e2e" stroke="#2e3440" stroke-width="1" />
</svg>