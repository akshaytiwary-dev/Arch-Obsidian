general {
    lock_cmd = pidof hyprlock || ~/.config/hypr/scripts/hyprlock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.config/hypr/scripts/resume-display.sh
    ignore_dbus_inhibit = false
}

listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 330                                 # 5.5min
    on-timeout = hyprctl dispatch dpms off        # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on          # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 120                                 # 2min
    on-timeout = ~/.config/hypr/scripts/smart-suspend.sh battery
}

listener {
    timeout = 300                                 # 5min
    on-timeout = ~/.config/hypr/scripts/smart-suspend.sh ac
}
